name: Publish Expert v1.5

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-expert-v1.5.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish Expert v1.5
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v1.5.0 >/dev/null 2>&1 || gh release create v1.5.0 expert.zip \
            --target "${GITHUB_SHA}" \
            --title "Expert v1.5" \
            --latest \
            --notes "Supported mobile browser chrome now matches Expert's dark theme. Agent headers show Learning now, next learning time, Paused, Ready to learn or Needs attention."
