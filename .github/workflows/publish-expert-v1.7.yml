name: Publish Expert v1.7

on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-expert-v1.7.yml']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply, package and publish v1.7
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d > 'CHANGELOG.md'
          mkdir -p 'expert'
          printf '%s' '' | base64 -d > 'expert/functions.php'
          mkdir -p 'expert'
          printf '%s' '' | base64 -d > 'expert/header.php'
          mkdir -p 'expert/inc'
          printf '%s' '' | base64 -d > 'expert/inc/config.php'
          mkdir -p 'expert/inc'
          printf '%s' '' | base64 -d > 'expert/inc/admin.php'
          mkdir -p 'expert/inc'
          printf '%s' '' | base64 -d > 'expert/inc/assets.php'
          mkdir -p 'expert/inc'
          printf '%s' '' | base64 -d > 'expert/inc/browser-ai.php'
          mkdir -p 'expert/inc'
          printf '%s' '' | base64 -d > 'expert/inc/embeddings.php'
          mkdir -p 'expert/inc'
          printf '%s' '' | base64 -d > 'expert/inc/rest.php'
          mkdir -p 'expert/inc'
          printf '%s' '' | base64 -d > 'expert/inc/scheduler.php'
          mkdir -p 'expert'
          printf '%s' '' | base64 -d > 'expert/readme.md'
          mkdir -p 'expert'
          printf '%s' '' | base64 -d > 'expert/readme.txt'
          mkdir -p 'expert/scripts'
          printf '%s' '' | base64 -d > 'expert/scripts/expert.js'
          mkdir -p 'expert'
          printf '%s' '' | base64 -d > 'expert/style.css'
          mkdir -p 'expert/styles'
          printf '%s' '' | base64 -d > 'expert/styles/expert.css'
          mkdir -p 'expert/templates'
          printf '%s' '' | base64 -d > 'expert/templates/home-agent.php'
          printf '%s' 'ew0KICAidmVyc2lvbiI6ICIxLjcuMCIsCiAgImJvZHkiOiAiQWRkcyBhdXRvbWF0aWMgc2VsZi1oZWFsaW5nIGxvY2FsIEFJLCB2aXNpYmxlIGxvYWRpbmcgcHJvZ3Jlc3MgYW5kIGNvb3BlcmF0aXZlIG11bHRpLWRldmljZSBsZWFybmluZy4iCn0K' | base64 -d > 'update.json'
          rm -f expert.zip
          zip -qr expert.zip expert
          python3 scripts/verify-package.py expert.zip
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add CHANGELOG.md expert expert.zip update.json
          git commit -m "Release Expert v1.7 cooperative local AI"
          git push
          gh release create v1.7.0 expert.zip --target main --title "Expert v1.7" --latest --notes "Adds automatic self-healing local AI, visible preparation progress and cooperative multi-device learning."

