name: Replace Expert v1.1 package

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/replace-expert-v1.1-package.yml

permissions:
  contents: write

jobs:
  replace-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace release package
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload v1.1.0 expert.zip --clobber
