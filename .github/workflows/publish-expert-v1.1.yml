name: Publish Expert v1.1

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-expert-v1.1.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release files
        uses: actions/checkout@v4

      - name: Publish Expert v1.1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v1.1.0 >/dev/null 2>&1 || gh release create v1.1.0 expert.zip \
            --target "${GITHUB_SHA}" \
            --title "Expert v1.1" \
            --latest \
            --notes "Expert v1.1 refreshes the interface while preserving the existing WordPress Multisite agent functionality.

          - New Expert visual system with responsive dark interface
          - Atomic network animation driven by the live Agent count
          - Live Agent, knowledge and network-state signals
          - Visible Manage Expert, Check for updates and Release notes links in Network Admin Themes
          - Reduced-motion support

          Install or update using the attached expert.zip package."
